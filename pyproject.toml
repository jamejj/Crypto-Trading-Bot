[project]
name = "crypto-trading-bot"
version = "0.1.0"
description = "Offline trading research foundation with read-only public capture"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.3",
]

[dependency-groups]
dev = ["pytest==9.0.2", "hypothesis==6.151.9", "ruff==0.15.7"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
